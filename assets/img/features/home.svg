<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Player housing and crafting">
  <defs>
    <linearGradient id="h_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0d17"/>
      <stop offset="60%" stop-color="#10172a"/>
      <stop offset="100%" stop-color="#1d2a45"/>
    </linearGradient>
    <linearGradient id="h_roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9162a"/>
      <stop offset="100%" stop-color="#5a0511"/>
    </linearGradient>
    <linearGradient id="h_wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f47b23"/>
      <stop offset="100%" stop-color="#7a2b00"/>
    </linearGradient>
    <radialGradient id="h_window" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff5c4"/>
      <stop offset="60%" stop-color="#ffc72c"/>
      <stop offset="100%" stop-color="#7a2b00"/>
    </radialGradient>
    <radialGradient id="h_smoke" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#8cd6ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8cd6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#h_sky)"/>

  <!-- moon -->
  <circle cx="510" cy="80" r="34" fill="#ffe27a" opacity="0.9"/>
  <circle cx="498" cy="74" r="6" fill="#0b0d17" opacity="0.25"/>
  <circle cx="520" cy="92" r="4" fill="#0b0d17" opacity="0.2"/>

  <!-- stars -->
  <g opacity="0.8">
    <circle cx="60"  cy="60"  r="1.2" fill="#fff"/>
    <circle cx="140" cy="100" r="1"   fill="#fff"/>
    <circle cx="220" cy="50"  r="1"   fill="#ffe27a"/>
    <circle cx="380" cy="80"  r="1"   fill="#fff"/>
    <circle cx="440" cy="40"  r="1.2" fill="#fff"/>
  </g>

  <!-- ground -->
  <path d="M0 360 L600 360 L600 450 L0 450 Z" fill="#0a1019"/>
  <path d="M0 360 Q150 350 300 358 Q450 366 600 358 L600 380 L0 380 Z" fill="#1a2436"/>

  <!-- house -->
  <g transform="translate(180,170)">
    <!-- chimney smoke -->
    <g>
      <circle cx="160" cy="-8" r="22" fill="url(#h_smoke)"/>
      <circle cx="170" cy="-30" r="16" fill="url(#h_smoke)"/>
    </g>
    <!-- chimney -->
    <rect x="148" y="-10" width="22" height="36" fill="#2a2c3d"/>
    <!-- roof -->
    <path d="M-10 60 L100 -10 L210 60 Z" fill="url(#h_roof)" stroke="#2a0006" stroke-width="2"/>
    <!-- walls -->
    <rect x="10" y="60" width="180" height="130" fill="url(#h_wall)" stroke="#3a1100" stroke-width="2"/>
    <!-- door -->
    <rect x="80" y="118" width="40" height="72" rx="3" fill="#2a1a08" stroke="#3a1100" stroke-width="2"/>
    <circle cx="113" cy="156" r="2" fill="#ffc72c"/>
    <!-- windows -->
    <rect x="28" y="86" width="36" height="36" fill="url(#h_window)" stroke="#3a1100" stroke-width="2"/>
    <line x1="46" y1="86" x2="46" y2="122" stroke="#3a1100" stroke-width="2"/>
    <line x1="28" y1="104" x2="64" y2="104" stroke="#3a1100" stroke-width="2"/>
    <rect x="136" y="86" width="36" height="36" fill="url(#h_window)" stroke="#3a1100" stroke-width="2"/>
    <line x1="154" y1="86" x2="154" y2="122" stroke="#3a1100" stroke-width="2"/>
    <line x1="136" y1="104" x2="172" y2="104" stroke="#3a1100" stroke-width="2"/>
    <!-- foundation -->
    <rect x="6" y="186" width="188" height="10" fill="#0a0c14"/>
    <!-- mat -->
    <rect x="78" y="190" width="44" height="6" fill="#ffc72c" opacity="0.7"/>
  </g>

  <!-- lantern lights -->
  <g>
    <circle cx="120" cy="320" r="10" fill="#ffc72c" opacity="0.6"/>
    <circle cx="120" cy="320" r="4"  fill="#fff5c4"/>
    <circle cx="480" cy="320" r="10" fill="#ffc72c" opacity="0.6"/>
    <circle cx="480" cy="320" r="4"  fill="#fff5c4"/>
  </g>

  <!-- furniture cards drifting in -->
  <g font-family="Russo One, Impact, sans-serif">
    <g transform="translate(28,40)">
      <rect width="120" height="40" rx="6" fill="#161826" stroke="#3b3e58"/>
      <!-- chair icon -->
      <g transform="translate(10,8)" stroke="#ffc72c" stroke-width="1.5" fill="none">
        <path d="M4 2 L4 18 L20 18 L20 2"/>
        <path d="M4 22 L4 26 M20 22 L20 26"/>
      </g>
      <text x="40" y="18" fill="#ffe27a" font-size="9" letter-spacing="1.2">RARE CHAIR</text>
      <text x="40" y="30" fill="#a8a6b8" font-size="8">From Ember Vault</text>
    </g>
    <g transform="translate(28,90)">
      <rect width="120" height="40" rx="6" fill="#161826" stroke="#3b3e58"/>
      <g transform="translate(10,8)" stroke="#8cd6ff" stroke-width="1.5" fill="none">
        <rect x="0" y="6" width="24" height="14"/>
        <line x1="0" y1="13" x2="24" y2="13"/>
      </g>
      <text x="40" y="18" fill="#ffe27a" font-size="9" letter-spacing="1.2">CRAFTED RUG</text>
      <text x="40" y="30" fill="#a8a6b8" font-size="8">Loom &middot; iron loom</text>
    </g>
    <g transform="translate(450,200)">
      <rect width="120" height="40" rx="6" fill="#161826" stroke="#3b3e58"/>
      <g transform="translate(10,7)" stroke="#ff5a1f" stroke-width="1.5" fill="none">
        <path d="M4 16 L12 4 L20 16 Z"/>
        <line x1="12" y1="16" x2="12" y2="22"/>
      </g>
      <text x="40" y="18" fill="#ffe27a" font-size="9" letter-spacing="1.2">SECRET LAMP</text>
      <text x="40" y="30" fill="#a8a6b8" font-size="8">Hidden chest drop</text>
    </g>
    <g transform="translate(450,250)">
      <rect width="120" height="40" rx="6" fill="#161826" stroke="#3b3e58"/>
      <g transform="translate(10,8)" stroke="#ffc72c" stroke-width="1.5" fill="none">
        <circle cx="12" cy="12" r="8"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
      </g>
      <text x="40" y="18" fill="#ffe27a" font-size="9" letter-spacing="1.2">TRAPHY DISP.</text>
      <text x="40" y="30" fill="#a8a6b8" font-size="8">Dragon Ball mount</text>
    </g>
  </g>
</svg>
